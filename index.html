<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SuDiTe — Prossimamente</title>
  <meta name="description" content="Sandali capresi fatti a mano in Sicilia. Prossimamente online." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; scroll-behavior: smooth; font-family: 'Cormorant Garamond', Georgia, serif; }

    /* SFONDO: Francesca a tutto schermo */
    .bg {
      position: fixed; inset: 0; z-index: 0;
      background-image: url('https://static.wixstatic.com/media/3b6bb2_5c1883be54aa4614b2e7f46480cc8830~mv2.jpg');
      background-size: cover;
      background-position: center top;
    }
    .overlay {
      position: fixed; inset: 0; z-index: 1;
      background: linear-gradient(
        to bottom,
        rgba(10, 5, 2, 0.45) 0%,
        rgba(10, 5, 2, 0.30) 40%,
        rgba(10, 5, 2, 0.70) 100%
      );
    }

    /* HERO */
    .hero {
      position: relative; z-index: 2;
      min-height: 100vh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: flex-end;
      text-align: center;
      padding: 0 24px 56px;
      color: #FFFDF8;
    }

    .logo {
      width: min(240px, 62vw);
      margin-bottom: 20px;
      filter: invert(1) brightness(2);
    }

    .coming {
      font-size: clamp(20px, 4vw, 32px);
      font-weight: 300;
      font-style: italic;
      letter-spacing: 0.08em;
      margin-bottom: 10px;
    }
    .tagline {
      font-size: clamp(13px, 2.2vw, 17px);
      font-weight: 400;
      line-height: 1.75;
      color: rgba(255,253,248,0.82);
      max-width: 420px;
      margin: 0 auto 28px;
    }

    .form-label {
      font-size: 10px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: rgba(255,253,248,0.55);
      margin-bottom: 10px;
    }
    .form-row {
      display: flex;
      border: 1px solid rgba(255,253,248,0.34);
      border-radius: 2px;
      overflow: hidden;
      width: min(360px, 88vw);
      margin: 0 auto 16px;
    }
    .form-row input {
      flex: 1; padding: 12px 14px;
      background: rgba(255,253,248,0.08);
      border: none; outline: none;
      color: #FFFDF8;
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 15px;
    }
    .form-row input::placeholder { color: rgba(255,253,248,0.34); }
    .form-row button {
      padding: 12px 20px;
      background: #A0522D; border: none; cursor: pointer;
      color: #FFFDF8;
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 13px; font-weight: 500;
      letter-spacing: 0.14em; text-transform: uppercase;
      transition: background 0.2s;
    }
    .form-row button:hover { background: #8B4513; }

    .contact {
      font-size: 12px;
      letter-spacing: 0.08em;
      color: rgba(255,253,248,0.45);
      margin-bottom: 24px;
    }
    .contact a {
      color: rgba(255,253,248,0.62);
      text-decoration: none;
      border-bottom: 1px solid rgba(255,253,248,0.20);
    }

    .btn-gallery {
      display: inline-block;
      padding: 12px 30px;
      border: 1px solid rgba(255,253,248,0.48);
      border-radius: 2px;
      color: #FFFDF8;
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 13px;
      font-weight: 400;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      text-decoration: none;
      transition: background 0.2s, border-color 0.2s;
    }
    .btn-gallery:hover {
      background: rgba(255,253,248,0.10);
      border-color: rgba(255,253,248,0.80);
    }

    /* GALLERIA */
    .gallery-section {
      position: relative; z-index: 2;
      background: #0F0804;
      padding: 64px 20px 80px;
    }
    .gallery-title {
      font-size: clamp(28px, 5vw, 48px);
      font-weight: 300;
      font-style: italic;
      color: #FFFDF8;
      text-align: center;
      letter-spacing: 0.06em;
      margin-bottom: 6px;
    }
    .gallery-sub {
      font-size: 11px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: rgba(255,253,248,0.40);
      text-align: center;
      margin-bottom: 44px;
    }

    /* COLLAGE ASIMMETRICO */
    .collage {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      grid-template-rows: auto auto;
      gap: 10px;
      max-width: 1000px;
      margin: 0 auto;
    }
    .collage img {
      width: 100%; height: 100%;
      object-fit: cover;
      border-radius: 2px;
      cursor: pointer;
      transition: transform 0.3s ease, opacity 0.3s;
    }
    .collage img:hover { transform: scale(1.03); opacity: 0.90; }

    /* Layout collage: prima grande a sinistra */
    .collage .c1 { grid-column: 1 / 3; grid-row: 1; aspect-ratio: 4/3; }
    .collage .c2 { grid-column: 3; grid-row: 1; aspect-ratio: 3/4; }
    .collage .c3 { grid-column: 1; grid-row: 2; aspect-ratio: 3/4; }
    .collage .c4 { grid-column: 2 / 4; grid-row: 2; aspect-ratio: 4/3; }

    /* Mobile: due colonne */
    @media (max-width: 600px) {
      .collage {
        grid-template-columns: 1fr 1fr;
        grid-template-rows: auto;
      }
      .collage .c1 { grid-column: 1 / 3; grid-row: 1; aspect-ratio: 16/9; }
      .collage .c2 { grid-column: 1; grid-row: 2; aspect-ratio: 1; }
      .collage .c3 { grid-column: 2; grid-row: 2; aspect-ratio: 1; }
      .collage .c4 { grid-column: 1 / 3; grid-row: 3; aspect-ratio: 16/9; }
    }

    /* LIGHTBOX */
    .lightbox {
      display: none;
      position: fixed; inset: 0; z-index: 100;
      background: rgba(8, 4, 2, 0.95);
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .lightbox.open { display: flex; }
    .lightbox img {
      max-width: 90vw;
      max-height: 88vh;
      object-fit: contain;
      border-radius: 2px;
      box-shadow: 0 8px 64px rgba(0,0,0,0.7);
    }
    .lightbox-close {
      position: absolute;
      top: 20px; right: 24px;
      color: rgba(255,253,248,0.7);
      font-size: 32px;
      cursor: pointer;
      line-height: 1;
      font-family: sans-serif;
    }
    .lightbox-close:hover { color: #FFFDF8; }
  </style>
</head>
<body>
  <div class="bg"></div>
  <div class="overlay"></div>

  <!-- HERO: Francesca sfondo, contenuto in basso -->
  <section class="hero">
    <img class="logo"
      src="https://links.wixel.com/link/E8GPNj0Z_m/raw"
      alt="SuDiTe — Handmade in Sicily by Francesca Pagano" />
    <p class="coming">Prossimamente</p>
    <p class="tagline">Su di te. Dal Sud. Cuciti addosso a te.</p>
    <p class="form-label">Avvisami quando apriamo</p>
    <div class="form-row">
      <input type="email" placeholder="La tua email" />
      <button>Iscriviti</button>
    </div>
    <p class="contact">Scrivici: <a href="mailto:info@sudite.art">info@sudite.art</a></p>
    <a class="btn-gallery" href="#galleria">Scopri i sandali</a>
  </section>

  <!-- GALLERIA -->
  <section class="gallery-section" id="galleria">
    <h2 class="gallery-title">I sandali</h2>
    <p class="gallery-sub">Artigianato caprèse &middot; Fatto a mano in Sicilia</p>
    <div class="collage">
      <img class="c1"
        src="https://links.wixel.com/link/bjBK8C2z-o/raw"
        alt="Sandali rossi con coralli"
        onclick="openLightbox(this.src)" />
      <img class="c2"
        src="https://links.wixel.com/link/KcVjt2j0ju/raw"
        alt="Sandali rossi dettaglio"
        onclick="openLightbox(this.src)" />
      <img class="c3"
        src="https://links.wixel.com/link/FAHMfL0pNX/raw"
        alt="Sandali bianchi oro fiorati"
        onclick="openLightbox(this.src)" />
      <img class="c4"
        src="https://links.wixel.com/link/0CBUWoAKsr/raw"
        alt="Sandali cristalli menta"
        onclick="openLightbox(this.src)" />
    </div>
  </section>

  <!-- LIGHTBOX -->
  <div class="lightbox" id="lightbox" onclick="closeLightbox()">
    <span class="lightbox-close" onclick="closeLightbox()">&times;</span>
    <img id="lightbox-img" src="" alt="" />
  </div>

  <script>
    function openLightbox(src) {
      document.getElementById('lightbox-img').src = src;
      document.getElementById('lightbox').classList.add('open');
    }
    function closeLightbox() {
      document.getElementById('lightbox').classList.remove('open');
    }
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') closeLightbox();
    });
  </script>
</body>
</html>
