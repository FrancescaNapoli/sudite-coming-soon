<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SuDiTe — Prossimamente</title>
  <meta name="description" content="Sandali capresi fatti a mano in Sicilia. Prossimamente online." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }

    /* SFONDO: logo soletta a tutto schermo */
    .bg {
      position: fixed; inset: 0; z-index: 0;
      background-image: url('https://static.wixstatic.com/media/3b6bb2_de256f90a40c44c3b686139e939b2d0f~mv2.jpg');
      background-size: cover; background-position: center;
      filter: brightness(0.55);
    }

    /* OVERLAY caldo */
    .overlay {
      position: fixed; inset: 0; z-index: 1;
      background: rgba(44, 26, 14, 0.35);
    }

    /* CONTENUTO */
    .page {
      position: relative; z-index: 2;
      min-height: 100vh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center;
      padding: 40px 24px 40px;
      color: #FFFDF8;
      font-family: 'Cormorant Garamond', Georgia, serif;
    }

    /* SANDALI - immagine grande in alto */
    .sandali {
      width: min(420px, 88vw);
      border-radius: 4px;
      margin-bottom: 28px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.45);
    }

    /* BRAND */
    .brand {
      font-size: clamp(64px, 13vw, 120px);
      font-weight: 300;
      letter-spacing: 0.20em;
      line-height: 1;
      margin-bottom: 8px;
    }
    .sub {
      font-size: clamp(12px, 2vw, 15px);
      font-weight: 400;
      letter-spacing: 0.30em;
      text-transform: uppercase;
      color: rgba(255,253,248,0.75);
      margin-bottom: 32px;
    }
    .coming {
      font-size: clamp(20px, 4vw, 34px);
      font-weight: 300;
      font-style: italic;
      letter-spacing: 0.06em;
      margin-bottom: 16px;
    }
    .tagline {
      font-size: clamp(14px, 2.4vw, 18px);
      font-weight: 400;
      line-height: 1.7;
      color: rgba(255,253,248,0.88);
      max-width: 480px;
      margin: 0 auto 40px;
    }

    /* FORM */
    .form-label {
      font-size: 12px;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: rgba(255,253,248,0.65);
      margin-bottom: 12px;
    }
    .form-row {
      display: flex;
      border: 1px solid rgba(255,253,248,0.40);
      border-radius: 2px;
      overflow: hidden;
      width: min(400px, 90vw);
      margin: 0 auto 28px;
    }
    .form-row input {
      flex: 1; padding: 13px 16px;
      background: rgba(255,253,248,0.10);
      border: none; outline: none;
      color: #FFFDF8;
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 16px;
    }
    .form-row input::placeholder { color: rgba(255,253,248,0.40); }
    .form-row button {
      padding: 13px 22px;
      background: #A0522D; border: none; cursor: pointer;
      color: #FFFDF8;
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 14px; font-weight: 500;
      letter-spacing: 0.14em; text-transform: uppercase;
    }
    .form-row button:hover { background: #8B4513; }

    .contact {
      font-size: 13px;
      letter-spacing: 0.08em;
      color: rgba(255,253,248,0.55);
      margin-bottom: 36px;
    }
    .contact a { color: rgba(255,253,248,0.72); text-decoration: none; border-bottom: 1px solid rgba(255,253,248,0.28); }

    /* FRANCESCA */
    .francesca {
      display: flex; flex-direction: column; align-items: center; gap: 10px;
    }
    .francesca img {
      width: min(180px, 44vw);
      border-radius: 4px;
      box-shadow: 0 6px 28px rgba(0,0,0,0.40);
      border: 2px solid rgba(255,253,248,0.30);
    }
    .francesca-name {
      font-size: 11px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: rgba(255,253,248,0.60);
    }
  </style>
</head>
<body>
  <div class="bg"></div>
  <div class="overlay"></div>
  <div class="page">

    <!-- Sandali coralli in alto -->
    <img class="sandali"
      src="https://static.wixstatic.com/media/3b6bb2_e40ce8d870c04937823174265685f893~mv2.jpg"
      alt="Sandali capresi SuDiTe" />

    <!-- Brand -->
    <h1 class="brand">SuDiTe</h1>
    <p class="sub">Sandali Capresi Artigianali &middot; Sicilia</p>
    <p class="coming">Prossimamente</p>
    <p class="tagline">Su di te. Dal Sud. Cuciti addosso a te.</p>

    <!-- Email -->
    <p class="form-label">Avvisami quando apriamo</p>
    <div class="form-row">
      <input type="email" placeholder="La tua email" />
      <button>Iscriviti</button>
    </div>
    <p class="contact">Scrivici: <a href="mailto:info@sudite.art">info@sudite.art</a></p>

    <!-- Francesca in verde -->
    <div class="francesca">
      <img src="https://static.wixstatic.com/media/3b6bb2_916ac53dbcd04edd90fcabe3bd4b9e74~mv2.jpg"
        alt="Francesca Pagano" />
      <span class="francesca-name">Francesca Pagano</span>
    </div>

  </div>
</body>
</html>
