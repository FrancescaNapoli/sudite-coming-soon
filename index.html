<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SuDiTe — Prossimamente</title>
  <meta name="description" content="Sandali capresi fatti a mano in Sicilia. Prossimamente online." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; scroll-behavior: smooth; }

    /* SFONDO */
    .bg {
      position: fixed; inset: 0; z-index: 0;
      background-image: url('https://links.wixel.com/link/-dRHqD7Zv6/raw');
      background-size: cover;
      background-position: center;
    }
    .overlay {
      position: fixed; inset: 0; z-index: 1;
      background: rgba(30, 16, 6, 0.60);
    }

    /* HERO */
    .hero {
      position: relative; z-index: 2;
      min-height: 100vh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center;
      padding: 48px 24px;
      color: #FFFDF8;
      font-family: 'Cormorant Garamond', Georgia, serif;
    }

    .logo {
      width: min(280px, 70vw);
      margin-bottom: 32px;
      filter: invert(1) brightness(2);
    }

    .coming {
      font-size: clamp(22px, 4.5vw, 36px);
      font-weight: 300;
      font-style: italic;
      letter-spacing: 0.08em;
      margin-bottom: 14px;
    }
    .tagline {
      font-size: clamp(14px, 2.4vw, 18px);
      font-weight: 400;
      line-height: 1.75;
      color: rgba(255,253,248,0.85);
      max-width: 460px;
      margin: 0 auto 36px;
    }

    .form-label {
      font-size: 11px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: rgba(255,253,248,0.58);
      margin-bottom: 12px;
    }
    .form-row {
      display: flex;
      border: 1px solid rgba(255,253,248,0.36);
      border-radius: 2px;
      overflow: hidden;
      width: min(380px, 88vw);
      margin: 0 auto 20px;
    }
    .form-row input {
      flex: 1; padding: 13px 16px;
      background: rgba(255,253,248,0.08);
      border: none; outline: none;
      color: #FFFDF8;
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 16px;
    }
    .form-row input::placeholder { color: rgba(255,253,248,0.36); }
    .form-row button {
      padding: 13px 22px;
      background: #A0522D; border: none; cursor: pointer;
      color: #FFFDF8;
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 14px; font-weight: 500;
      letter-spacing: 0.14em; text-transform: uppercase;
      transition: background 0.2s;
    }
    .form-row button:hover { background: #8B4513; }

    .contact {
      font-size: 13px;
      letter-spacing: 0.08em;
      color: rgba(255,253,248,0.48);
      margin-bottom: 32px;
    }
    .contact a {
      color: rgba(255,253,248,0.65);
      text-decoration: none;
      border-bottom: 1px solid rgba(255,253,248,0.22);
    }

    /* BOTTONE GALLERIA */
    .btn-gallery {
      display: inline-block;
      padding: 13px 32px;
      border: 1px solid rgba(255,253,248,0.50);
      border-radius: 2px;
      color: #FFFDF8;
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 14px;
      font-weight: 400;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      text-decoration: none;
      transition: background 0.2s, border-color 0.2s;
    }
    .btn-gallery:hover {
      background: rgba(255,253,248,0.10);
      border-color: rgba(255,253,248,0.80);
    }

    /* GALLERIA */
    .gallery-section {
      position: relative; z-index: 2;
      background: #1A0D05;
      padding: 64px 24px 80px;
    }
    .gallery-title {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: clamp(28px, 5vw, 48px);
      font-weight: 300;
      font-style: italic;
      color: #FFFDF8;
      text-align: center;
      letter-spacing: 0.06em;
      margin-bottom: 8px;
    }
    .gallery-sub {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 12px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: rgba(255,253,248,0.45);
      text-align: center;
      margin-bottom: 48px;
    }
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 12px;
      max-width: 1100px;
      margin: 0 auto;
    }
    .gallery-grid img {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      border-radius: 2px;
      transition: transform 0.3s ease, opacity 0.3s ease;
      cursor: pointer;
    }
    .gallery-grid img:hover {
      transform: scale(1.03);
      opacity: 0.92;
    }
    /* Primo elemento più grande */
    .gallery-grid img:first-child {
      grid-column: span 2;
      aspect-ratio: 16 / 9;
    }

    /* LIGHTBOX */
    .lightbox {
      display: none;
      position: fixed; inset: 0; z-index: 100;
      background: rgba(10, 5, 2, 0.93);
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .lightbox.open { display: flex; }
    .lightbox img {
      max-width: 90vw;
      max-height: 88vh;
      object-fit: contain;
      border-radius: 2px;
      box-shadow: 0 8px 64px rgba(0,0,0,0.7);
    }
    .lightbox-close {
      position: absolute;
      top: 20px; right: 24px;
      color: rgba(255,253,248,0.7);
      font-size: 32px;
      cursor: pointer;
      line-height: 1;
      font-family: sans-serif;
    }
    .lightbox-close:hover { color: #FFFDF8; }
  </style>
</head>
<body>
  <div class="bg"></div>
  <div class="overlay"></div>

  <!-- HERO -->
  <section class="hero">
    <img class="logo"
      src="https://links.wixel.com/link/E8GPNj0Z_m/raw"
      alt="SuDiTe — Handmade in Sicily by Francesca Pagano" />
    <p class="coming">Prossimamente</p>
    <p class="tagline">Su di te. Dal Sud. Cuciti addosso a te.</p>
    <p class="form-label">Avvisami quando apriamo</p>
    <div class="form-row">
      <input type="email" placeholder="La tua email" />
      <button>Iscriviti</button>
    </div>
    <p class="contact">Scrivici: <a href="mailto:info@sudite.art">info@sudite.art</a></p>
    <a class="btn-gallery" href="#galleria">Scopri i sandali</a>
  </section>

  <!-- GALLERIA -->
  <section class="gallery-section" id="galleria">
    <h2 class="gallery-title">I sandali</h2>
    <p class="gallery-sub">Artigianato caprèse &middot; Fatto a mano in Sicilia</p>
    <div class="gallery-grid">
      <img src="https://static.wixstatic.com/media/3b6bb2_e40ce8d870c04937823174265685f893~mv2.jpg" alt="Sandali rossi con coralli" onclick="openLightbox(this.src)" />
      <img src="https://static.wixstatic.com/media/3b6bb2_18048dde5a3e426691e0c79394c0b7af~mv2.jpg" alt="Sandali bianchi oro fiorato" onclick="openLightbox(this.src)" />
      <img src="https://static.wixstatic.com/media/3b6bb2_4f3f24e9b2864e3fa3a98f4cc1d0a5b1~mv2.jpg" alt="Sandali bianchi oro fiorato 2" onclick="openLightbox(this.src)" />
      <img src="https://static.wixstatic.com/media/3b6bb2_1f3c9e1a2a9a4b5c8d7e6f0a1b2c3d4e~mv2.jpg" alt="Sandalo gioiello cristalli" onclick="openLightbox(this.src)" />
      <img src="https://static.wixstatic.com/media/3b6bb2_916ac53dbcd04edd90fcabe3bd4b9e74~mv2.jpg" alt="Francesca Pagano" onclick="openLightbox(this.src)" />
      <img src="https://static.wixstatic.com/media/3b6bb2_de256f90a40c44c3b686139e939b2d0f~mv2.jpg" alt="La soletta" onclick="openLightbox(this.src)" />
    </div>
  </section>

  <!-- LIGHTBOX -->
  <div class="lightbox" id="lightbox" onclick="closeLightbox()">
    <span class="lightbox-close" onclick="closeLightbox()">&times;</span>
    <img id="lightbox-img" src="" alt="" />
  </div>

  <script>
    function openLightbox(src) {
      document.getElementById('lightbox-img').src = src;
      document.getElementById('lightbox').classList.add('open');
    }
    function closeLightbox() {
      document.getElementById('lightbox').classList.remove('open');
    }
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') closeLightbox();
    });
  </script>
</body>
</html>
