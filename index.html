<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SuDiTe — Prossimamente</title>
  <meta name="description" content="Sandali capresi fatti a mano in Sicilia. Prossimamente online." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --beige: #F5EFE0; --cognac: #A0522D; --brown: #2C1A0E; --cream: #FFFDF8; --overlay: rgba(80,40,10,0.45); }
    html, body { height: 100%; background-color: var(--brown); color: var(--cream); font-family: 'Cormorant Garamond', Georgia, serif; }
    .hero { position: relative; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 40px 24px 160px; overflow: hidden; }
    .hero__bg { position: absolute; inset: 0; background-image: url('https://static.wixstatic.com/media/3b6bb2_f90b9974dc41477dbd46d66bdb9d7a87~mv2.jpg'); background-size: cover; background-position: center 30%; z-index: 0; }
    .hero__overlay { position: absolute; inset: 0; background: var(--overlay); z-index: 1; }
    .hero__content { position: relative; z-index: 2; max-width: 680px; width: 100%; }
    .hero__logo-img { width: 72px; height: 72px; border-radius: 50%; object-fit: cover; object-position: center; border: 2px solid rgba(255,253,248,0.4); margin-bottom: 28px; display: block; margin-left: auto; margin-right: auto; }
    .hero__brand { font-size: clamp(72px, 14vw, 128px); font-weight: 300; letter-spacing: 0.18em; color: var(--cream); line-height: 1; margin-bottom: 12px; }
    .hero__subtitle-brand { font-size: clamp(13px, 2.2vw, 16px); font-weight: 400; letter-spacing: 0.28em; text-transform: uppercase; color: rgba(255,253,248,0.78); margin-bottom: 40px; }
    .hero__coming { font-size: clamp(22px, 4.5vw, 38px); font-weight: 300; font-style: italic; letter-spacing: 0.06em; color: var(--cream); margin-bottom: 20px; }
    .hero__tagline { font-size: clamp(15px, 2.6vw, 20px); font-weight: 400; line-height: 1.65; color: rgba(255,253,248,0.90); margin-bottom: 48px; max-width: 520px; margin-left: auto; margin-right: auto; }
    .form { display: flex; flex-direction: column; align-items: center; gap: 0; width: 100%; max-width: 440px; margin: 0 auto 36px; }
    .form__label { font-size: 13px; letter-spacing: 0.22em; text-transform: uppercase; color: rgba(255,253,248,0.70); margin-bottom: 14px; }
    .form__row { display: flex; width: 100%; border: 1px solid rgba(255,253,248,0.45); border-radius: 2px; overflow: hidden; }
    .form__input { flex: 1; padding: 14px 18px; background: rgba(255,253,248,0.10); border: none; outline: none; color: var(--cream); font-family: 'Cormorant Garamond', Georgia, serif; font-size: 16px; }
    .form__input::placeholder { color: rgba(255,253,248,0.45); }
    .form__btn { padding: 14px 26px; background: var(--cognac); border: none; cursor: pointer; color: var(--cream); font-family: 'Cormorant Garamond', Georgia, serif; font-size: 15px; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; transition: background 0.2s; white-space: nowrap; }
    .form__btn:hover { background: #8B4513; }
    .hero__contact { font-size: 14px; letter-spacing: 0.10em; color: rgba(255,253,248,0.60); }
    .hero__contact a { color: rgba(255,253,248,0.75); text-decoration: none; border-bottom: 1px solid rgba(255,253,248,0.30); }
    .francesca { position: absolute; bottom: 28px; right: 36px; z-index: 3; display: flex; flex-direction: column; align-items: center; gap: 8px; }
    .francesca__img { width: 96px; height: 96px; border-radius: 50%; object-fit: cover; object-position: center top; border: 2px solid rgba(255,253,248,0.5); }
    .francesca__name { font-size: 11px; letter-spacing: 0.20em; text-transform: uppercase; color: rgba(255,253,248,0.65); }
    @media (max-width: 600px) { .francesca { bottom: 16px; right: 16px; } .francesca__img { width: 72px; height: 72px; } }
  </style>
</head>
<body>
  <section class="hero">
    <div class="hero__bg"></div>
    <div class="hero__overlay"></div>
    <div class="hero__content">
      <img class="hero__logo-img" src="https://static.wixstatic.com/media/3b6bb2_de256f90a40c44c3b686139e939b2d0f~mv2.jpg" alt="Logo SuDiTe" />
      <h1 class="hero__brand">SuDiTe</h1>
      <p class="hero__subtitle-brand">Sandali Capresi Artigianali &mdash; Sicilia</p>
      <p class="hero__coming">Prossimamente</p>
      <p class="hero__tagline">Su di te. Dal Sud. Cuciti addosso a te.</p>
      <div class="form">
        <p class="form__label">Avvisami quando apriamo</p>
        <div class="form__row">
          <input class="form__input" type="email" placeholder="La tua email" />
          <button class="form__btn">Iscriviti</button>
        </div>
      </div>
      <p class="hero__contact">Scrivici: <a href="mailto:info@sudite.art">info@sudite.art</a></p>
    </div>
    <div class="francesca">
      <img class="francesca__img" src="https://static.wixstatic.com/media/3b6bb2_5c1883be54aa4614b2e7f46480cc8830~mv2.jpg" alt="Francesca Pagano" />
      <span class="francesca__name">Francesca Pagano</span>
    </div>
  </section>
</body>
</html>
