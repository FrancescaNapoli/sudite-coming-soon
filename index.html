<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SuDiTe — Prossimamente</title>
  <meta name="description" content="Sandali capresi fatti a mano in Sicilia. Prossimamente online." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }

    .bg {
      position: fixed; inset: 0; z-index: 0;
      background-image: url('https://links.wixel.com/link/-dRHqD7Zv6/raw');
      background-size: cover;
      background-position: center;
    }
    .overlay {
      position: fixed; inset: 0; z-index: 1;
      background: rgba(30, 16, 6, 0.60);
    }

    .page {
      position: relative; z-index: 2;
      min-height: 100vh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center;
      padding: 48px 24px;
      color: #FFFDF8;
      font-family: 'Cormorant Garamond', Georgia, serif;
    }

    /* LOGO */
    .logo {
      width: min(280px, 70vw);
      margin-bottom: 32px;
      filter: invert(1) brightness(2);
    }

    .coming {
      font-size: clamp(22px, 4.5vw, 36px);
      font-weight: 300;
      font-style: italic;
      letter-spacing: 0.08em;
      margin-bottom: 14px;
    }
    .tagline {
      font-size: clamp(14px, 2.4vw, 18px);
      font-weight: 400;
      line-height: 1.75;
      color: rgba(255,253,248,0.85);
      max-width: 460px;
      margin: 0 auto 44px;
    }

    .form-label {
      font-size: 11px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: rgba(255,253,248,0.58);
      margin-bottom: 12px;
    }
    .form-row {
      display: flex;
      border: 1px solid rgba(255,253,248,0.36);
      border-radius: 2px;
      overflow: hidden;
      width: min(380px, 88vw);
      margin: 0 auto 22px;
    }
    .form-row input {
      flex: 1; padding: 13px 16px;
      background: rgba(255,253,248,0.08);
      border: none; outline: none;
      color: #FFFDF8;
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 16px;
    }
    .form-row input::placeholder { color: rgba(255,253,248,0.36); }
    .form-row button {
      padding: 13px 22px;
      background: #A0522D; border: none; cursor: pointer;
      color: #FFFDF8;
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 14px; font-weight: 500;
      letter-spacing: 0.14em; text-transform: uppercase;
      transition: background 0.2s;
    }
    .form-row button:hover { background: #8B4513; }

    .contact {
      font-size: 13px;
      letter-spacing: 0.08em;
      color: rgba(255,253,248,0.48);
    }
    .contact a {
      color: rgba(255,253,248,0.65);
      text-decoration: none;
      border-bottom: 1px solid rgba(255,253,248,0.22);
    }
  </style>
</head>
<body>
  <div class="bg"></div>
  <div class="overlay"></div>
  <div class="page">
    <img class="logo"
      src="https://links.wixel.com/link/E8GPNj0Z_m/raw"
      alt="SuDiTe — Handmade in Sicily by Francesca Pagano" />
    <p class="coming">Prossimamente</p>
    <p class="tagline">Su di te. Dal Sud. Cuciti addosso a te.</p>
    <p class="form-label">Avvisami quando apriamo</p>
    <div class="form-row">
      <input type="email" placeholder="La tua email" />
      <button>Iscriviti</button>
    </div>
    <p class="contact">Scrivici: <a href="mailto:info@sudite.art">info@sudite.art</a></p>
  </div>
</body>
</html>
