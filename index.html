<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SuDiTè — Coming Soon</title>
  <meta name="description" content="Sandali capresi fatti a mano in Sicilia. Prossimamente online." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; scroll-behavior: smooth; font-family: 'Cormorant Garamond', Georgia, serif; }

    .hero {
      position: relative;
      min-height: 100vh;
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: #0A0503;
      color: #FFFDF8;
    }

    .hero-img {
      position: relative;
      overflow: hidden;
    }
    .hero-img img {
      width: 100%; height: 100%;
      object-fit: cover;
      object-position: top center;
      display: block;
    }
    .hero-img-overlay {
      position: absolute; inset: 0;
      background: linear-gradient(to right, rgba(10,5,3,0) 55%, #0A0503 100%);
    }

    .hero-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 18vh 48px 48px;
      text-align: center;
      background: #0A0503;
    }

    .coming-soon {
      font-size: clamp(36px, 4vw, 64px);
      font-weight: 300;
      font-style: italic;
      letter-spacing: 0.04em;
      color: #FFFDF8;
      margin-bottom: 28px;
      line-height: 1;
    }

    /* Logo dorato trasparente: nessun filtro, sfondo nero fa risaltare l'oro */
    .logo {
      width: clamp(220px, 80%, 380px);
      margin-bottom: 16px;
    }

    .prossimamente {
      font-size: clamp(11px, 1vw, 13px);
      font-weight: 400;
      letter-spacing: 0.30em;
      text-transform: uppercase;
      color: rgba(255,253,248,0.40);
      margin-bottom: 20px;
    }

    .tagline {
      font-size: clamp(14px, 1.3vw, 18px);
      font-weight: 400; line-height: 1.75;
      font-style: italic;
      color: rgba(255,253,248,0.72);
      max-width: 360px; margin: 0 auto 26px;
    }
    .form-label {
      font-size: 10px; letter-spacing: 0.28em;
      text-transform: uppercase;
      color: rgba(255,253,248,0.46); margin-bottom: 10px;
    }
    .form-row {
      display: flex;
      border: 1px solid rgba(255,253,248,0.28);
      border-radius: 2px; overflow: hidden;
      width: min(360px, 100%); margin: 0 auto 14px;
    }
    .form-row input {
      flex: 1; padding: 12px 14px;
      background: rgba(255,253,248,0.06);
      border: none; outline: none;
      color: #FFFDF8;
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 15px;
    }
    .form-row input::placeholder { color: rgba(255,253,248,0.28); }
    .form-row button {
      padding: 12px 20px;
      background: #A0522D; border: none; cursor: pointer;
      color: #FFFDF8;
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 13px; font-weight: 500;
      letter-spacing: 0.14em; text-transform: uppercase;
      transition: background 0.2s;
    }
    .form-row button:hover { background: #8B4513; }
    .contact {
      font-size: 12px; letter-spacing: 0.08em;
      color: rgba(255,253,248,0.36); margin-bottom: 20px;
    }
    .contact a {
      color: rgba(255,253,248,0.52); text-decoration: none;
      border-bottom: 1px solid rgba(255,253,248,0.14);
    }
    .btn-row {
      display: flex; gap: 12px;
      align-items: center; justify-content: center; flex-wrap: wrap;
    }
    .btn-gallery, .btn-music {
      display: inline-block;
      padding: 12px 24px;
      border: 1px solid rgba(255,253,248,0.36);
      border-radius: 2px;
      color: #FFFDF8;
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 12px; font-weight: 400;
      letter-spacing: 0.18em; text-transform: uppercase;
      text-decoration: none; cursor: pointer;
      background: transparent;
      transition: background 0.2s, border-color 0.2s;
    }
    .btn-gallery:hover, .btn-music:hover {
      background: rgba(255,253,248,0.10);
      border-color: rgba(255,253,248,0.75);
    }
    .btn-music.playing { border-color: #A0522D; color: #f0c898; }

    @media (max-width: 768px) {
      .hero {
        grid-template-columns: 1fr;
        grid-template-rows: 50vh auto;
      }
      .hero-img { height: 50vh; }
      .hero-img-overlay {
        background: linear-gradient(to bottom, rgba(10,5,3,0) 40%, #0A0503 100%);
      }
      .hero-content {
        padding: 32px 24px 48px;
        justify-content: flex-start;
      }
      .logo { width: clamp(180px, 72vw, 300px); }
      .coming-soon { font-size: clamp(32px, 10vw, 52px); }
    }

    #yt-frame {
      position: absolute; width: 1px; height: 1px;
      top: -9999px; left: -9999px; pointer-events: none;
    }

    .gallery-section {
      background: #060302;
      padding: 72px 24px 88px;
      border-top: 1px solid rgba(255,253,248,0.07);
    }
    .gallery-title {
      font-size: clamp(30px, 4vw, 54px);
      font-weight: 300; font-style: italic;
      color: #FFFDF8; text-align: center;
      letter-spacing: 0.06em; margin-bottom: 8px;
    }
    .gallery-sub {
      font-size: 11px; letter-spacing: 0.28em;
      text-transform: uppercase;
      color: rgba(255,253,248,0.35);
      text-align: center; margin-bottom: 48px;
    }
    .collage {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 12px; max-width: 1100px; margin: 0 auto;
    }
    .collage img {
      width: 100%; height: 100%; object-fit: cover;
      border-radius: 2px; cursor: pointer;
      transition: transform 0.3s, opacity 0.3s;
    }
    .collage img:hover { transform: scale(1.03); opacity: 0.88; }
    .collage .c1 { grid-column:1/3; grid-row:1; aspect-ratio:4/3; }
    .collage .c2 { grid-column:3; grid-row:1; aspect-ratio:3/4; }
    .collage .c3 { grid-column:1; grid-row:2; aspect-ratio:3/4; }
    .collage .c4 { grid-column:2/4; grid-row:2; aspect-ratio:4/3; }
    @media (max-width: 600px) {
      .collage { grid-template-columns: 1fr 1fr; }
      .collage .c1 { grid-column:1/3; grid-row:1; aspect-ratio:16/9; }
      .collage .c2 { grid-column:1; grid-row:2; aspect-ratio:1; }
      .collage .c3 { grid-column:2; grid-row:2; aspect-ratio:1; }
      .collage .c4 { grid-column:1/3; grid-row:3; aspect-ratio:16/9; }
    }
    .lightbox {
      display: none; position: fixed; inset: 0; z-index: 100;
      background: rgba(6,3,2,0.96);
      align-items: center; justify-content: center; padding: 24px;
    }
    .lightbox.open { display: flex; }
    .lightbox img {
      max-width: 90vw; max-height: 88vh;
      object-fit: contain; border-radius: 2px;
      box-shadow: 0 8px 64px rgba(0,0,0,0.8);
    }
    .lightbox-close {
      position: absolute; top: 20px; right: 24px;
      color: rgba(255,253,248,0.65);
      font-size: 32px; cursor: pointer;
      font-family: sans-serif; line-height: 1;
    }
    .lightbox-close:hover { color: #FFFDF8; }
  </style>
</head>
<body>
  <div id="yt-frame"></div>

  <section class="hero">
    <div class="hero-img">
      <img src="https://static.wixstatic.com/media/3b6bb2_5c1883be54aa4614b2e7f46480cc8830~mv2.jpg"
        alt="Francesca Pagano" />
      <div class="hero-img-overlay"></div>
    </div>

    <div class="hero-content">
      <p class="coming-soon">Coming Soon</p>
      <img class="logo"
        src="https://links.wixel.com/link/KDVbetMxmg/raw"
        alt="SuDiTè — Handmade in Sicily by Francesca Pagano" />
      <p class="prossimamente">Prossimamente</p>
      <p class="tagline">Su di te. Dal Sud. Cuciti addosso a te.</p>
      <p class="form-label">Avvisami quando apriamo</p>
      <div class="form-row">
        <input type="email" placeholder="La tua email" />
        <button type="button">Iscriviti</button>
      </div>
      <p class="contact">Scrivici: <a href="mailto:info@sudite.art">info@sudite.art</a></p>
      <div class="btn-row">
        <a class="btn-gallery" href="#galleria">Scopri i sandali</a>
        <button class="btn-music" id="music-btn" onclick="toggleMusic()">&#9654; Rock e Rais</button>
      </div>
    </div>
  </section>

  <section class="gallery-section" id="galleria">
    <h2 class="gallery-title">I sandali</h2>
    <p class="gallery-sub">Artigianato caprèse &middot; Fatto a mano in Sicilia</p>
    <div class="collage">
      <img class="c1" src="https://links.wixel.com/link/bjBK8C2z-o/raw" alt="Sandali rossi con coralli" onclick="openLightbox(this.src)" />
      <img class="c2" src="https://links.wixel.com/link/b_J5t1b-bO/raw" alt="Sandali rafia multicolore" onclick="openLightbox(this.src)" />
      <img class="c3" src="https://links.wixel.com/link/FAHMfL0pNX/raw" alt="Sandali bianchi oro fiorati" onclick="openLightbox(this.src)" />
      <img class="c4" src="https://links.wixel.com/link/0CBUWoAKsr/raw" alt="Sandali cristalli menta" onclick="openLightbox(this.src)" />
    </div>
  </section>

  <div class="lightbox" id="lightbox" onclick="closeLightbox()">
    <span class="lightbox-close" onclick="closeLightbox()">&times;</span>
    <img id="lightbox-img" src="" alt="" />
  </div>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    var player, isPlaying=false, isReady=false;
    function onYouTubeIframeAPIReady(){
      player=new YT.Player('yt-frame',{
        videoId:'RdVYUKCwhJE',
        playerVars:{autoplay:0,loop:1,playlist:'RdVYUKCwhJE',controls:0,disablekb:1,fs:0,modestbranding:1},
        events:{
          onReady:function(){isReady=true;},
          onStateChange:function(e){if(e.data===YT.PlayerState.ENDED){player.seekTo(0);player.playVideo();}}
        }
      });
    }
    function toggleMusic(){
      var btn=document.getElementById('music-btn');
      if(!isReady){btn.innerHTML='Carico...';setTimeout(function(){btn.innerHTML='&#9654; Rock e Rais';},2000);return;}
      if(!isPlaying){player.setVolume(70);player.playVideo();btn.innerHTML='&#9646;&#9646; Rock e Rais';btn.classList.add('playing');isPlaying=true;}
      else{player.pauseVideo();btn.innerHTML='&#9654; Rock e Rais';btn.classList.remove('playing');isPlaying=false;}
    }
    function openLightbox(src){document.getElementById('lightbox-img').src=src;document.getElementById('lightbox').classList.add('open');}
    function closeLightbox(){document.getElementById('lightbox').classList.remove('open');}
    document.addEventListener('keydown',e=>{if(e.key==='Escape')closeLightbox();});
  </script>
</body>
</html>
